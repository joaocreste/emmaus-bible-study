# Builds the static edition of Emmaus and publishes it to GitHub Pages.
# The public edition has no inference server: live composition is available only when
# the app runs locally with an Anthropic API key (see docs/INFERENCE.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # STEPBible asks projects to point to their repository rather than redistribute the
      # data, so the tagged Hebrew/Greek, lexicons and concordance are fetched at build time.
      - name: Fetch STEPBible data
        run: node scripts/data/build-all.ts --only=stepbible
      - name: Unit and data-integrity tests
        run: npx vitest run src
      - name: Omit Hebrew lexicon definitions (pending permission from Online Bible)
        run: node scripts/public/strip-restricted.ts
      - uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC_SITE: '1'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
